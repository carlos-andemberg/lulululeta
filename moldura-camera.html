<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>lulululeta · Moldura da Câmera</title>
<link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
<!--
  ================================================================
   LULULULETA · MOLDURA DA CÂMERA  -  fonte "Navegador" do OBS
  ================================================================
   Moldura de Madoka, toda rosa: borda rosa com filete dourado e
   rendinha branca por dentro, a Soul Gem da Madoka no canto, em
   cima de um círculo mágico girando, com o laço vermelho do cabelo
   dela amarrado ali. Da gema desce uma fita com o nome, uma letra
   embaixo da outra. O Kyubey fica sentado lá embaixo, perto das
   rosinhas, e penas cor-de-rosa caem devagar.

   De tempos em tempos tem FLECHA: a Madoka aparece no ar, em cima
   de um circulinho mágico, puxa o arco de rosa e solta uma flecha
   de luz, que estoura no alto numa chuva de flechinhas e penas. A
   Soul Gem acende, o círculo gira, a fita pula e o Kyubey fecha o
   contrato. E de vez em quando ele solta um balãozinho oferecendo
   um contrato.

   DOIS MODELOS
     ?tela=lol   a tela do LoL: câmera no canto de baixo-direito,
                 encostada nas beiradas (o padrão). A fonte cobre a
                 tela toda.
     ?solta      só a câmera, com borda em volta toda: a fonte é a
                 câmera + uma margem pros enfeites. Agrupe com a
                 webcam no OBS e mova as duas juntas.

   COMO COLOCAR NO OBS (tela do LoL)
     1. Fontes -> + -> Navegador
     2. URL: o link desta página, ex.: ?tela=lol
     3. Largura e altura = tamanho da tela do OBS (1920 x 1080).
        A moldura cai sozinha em volta da câmera.
     4. Deixe a moldura ACIMA da câmera na lista de fontes.

   OPÇÕES NO LINK (junte com &)
     ?tela=lol                 a tela do LoL (o padrão)
     ?solta                    modelo só da câmera (usa só largura/altura)
     ?x=1599&y=781             canto de cima-esquerdo da câmera, em pixels da tela
     ?largura=321&altura=299   tamanho da câmera
     ?resolucao=1280x720       tamanho da tela do OBS, se não for 1920x1080
     ?nome=Lulu                texto da fita (?nome= esconde)
     ?penas=12                 quantas penas caindo (0 a 300; 0 = sem penas)
     ?velocidade=0.6           velocidade das penas (1 = o padrão, 2 = rápido)
     ?flecha=45                segundos entre uma flecha e outra (0 = desliga)
     ?madoka=0                 flecha sem a Madoka (sai da Soul Gem)
     ?kyubey=0                 sem o Kyubey
     ?gema=0                   sem a Soul Gem (e o círculo mágico)
     ?laco=0                   sem o laço vermelho
     ?rosas=0                  sem as rosinhas e o coração
     ?falas=0                  sem os balõezinhos do Kyubey
     ?falas=Oi,Tudo bem?       troca as falas (separe com vírgula)
     ?zoom                     só na prévia: mostra a moldura de pertinho

   Abrindo no navegador aparece um fundo de exemplo, com o HUD do
   LoL de mentirinha no lugar (clique em qualquer lugar pra soltar
   a flecha). Dentro do OBS o fundo fica transparente.
  ================================================================
-->
<script>
const CONFIG = {
  nome: "lulululeta",            // texto da fita que desce do canto, uma letra embaixo da outra ("" = esconde)  ·  link: ?nome=Lulu
  fonte: "Cherry Bomb One",      // letra do nome e dos balões (Google Fonts, no <link> lá em cima)

  tela: { largura: 1920, altura: 1080 },   // tela do OBS em que as medidas abaixo valem
  telas: {                                 // medida da live: câmera no canto de baixo-direito, encostada nas beiradas  ·  link: ?tela=lol
    lol: { cam: { x: 1599, y: 781, largura: 321, altura: 299 } },
  },
  telaPadrao: "lol",
  solta: { largura: 321, altura: 299 },    // câmera padrão do modelo solto  ·  link: ?solta&largura=&altura=

  penas: 8,                      // quantas penas caindo  ·  link: ?penas=12
  velocidade: 1,                 // velocidade delas: 2 = rápido, 0.5 = bem devagar  ·  link: ?velocidade=0.6
  flecha: 30,                    // segundos entre uma flecha e outra, 0 = desliga  ·  link: ?flecha=45
  madoka: true,                  // na flecha, a Madoka aparece no ar com o arco  ·  link: ?madoka=0
  kyubey: true,                  // o Kyubey sentado lá embaixo, do lado de fora (no solto, em cima da borda)  ·  link: ?kyubey=0
  gema: true,                    // a Soul Gem no canto, com o círculo mágico  ·  link: ?gema=0
  laco: true,                    // o laço vermelho amarrado no canto  ·  link: ?laco=0
  rosas: true,                   // rosinhas e coração na borda  ·  link: ?rosas=0
  falas: ["／人◕ ‿‿ ◕人＼", "Faça um contrato comigo!", "Vire uma garota mágica!", "Qual é o seu desejo?", "Qualquer desejo mesmo!",
          "Só um contratinho...", "É só assinar aqui", "Não entendo os humanos"],
  falaFlecha: "Contrato fechado!", // o que o Kyubey fala quando a flecha estoura
  falasCada: 16,                 // segundos entre um balãozinho e outro  ·  link: ?falas=0 desliga

  borda: 13,                     // grossura da borda (numa câmera de 400 de largura; cresce junto com ela)
  raio: 10,                      // cantos arredondados (a câmera dela tem canto reto)

  cores: {
    rosa: "#ff7eb9", rosaClaro: "#ffc6e0", rosaEscuro: "#e2489a", magenta: "#b8186a",
    dourado: "#f6c95c", douradoClaro: "#fff2bd", douradoEscuro: "#c98e22",
    vermelho: "#e3263f", vermelhoEscuro: "#9e1229",   // o laço do cabelo da Madoka
    contorno: "#3a0f2e",         // vinho quase preto dos contornos
  },

  fundoDemo: "auto",             // "auto" = fundo de exemplo só fora do OBS · true / false força
};
</script>

<style>
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; }
  body.demo { background:#0b1420; cursor:pointer; }

  .palco { position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden; }
  .palco > svg, .palco > canvas { position:absolute; display:block; overflow:visible; }

  /* ---------- prévia (só fora do OBS) ---------- */
  .demo-only { display:none; }
  body.demo .palco {
    background:
      radial-gradient(ellipse at 62% 38%, rgba(190,225,255,.22), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 90px, rgba(0,0,0,.05) 90px 180px),
      linear-gradient(160deg, #3b5f86 0%, #253f60 45%, #142438 100%);
  }
  body.demo.solta .palco { background:linear-gradient(160deg, #3a2440, #221629); }
  body.demo .demo-only { display:flex; }
  .cam-box {
    position:absolute; align-items:center; justify-content:center; overflow:hidden;
    background:repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 14px, transparent 14px 28px), linear-gradient(160deg, #8a6b52, #4e3b4c);
    color:rgba(255,220,238,.6); font:700 26px 'Segoe UI', Arial, sans-serif; letter-spacing:3px; text-transform:uppercase;
  }
  .hud { position:absolute; background:rgba(8,14,22,.55); border:2px solid rgba(200,170,110,.45); border-radius:6px;
         align-items:center; justify-content:center; text-align:center;
         color:rgba(255,255,255,.72); font:600 calc(18px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; padding:4px; }
  .hud.meta { background:linear-gradient(90deg, #ef2fd0 49%, #fff 49%); border:0; border-radius:2px; color:#f28ad8; font:800 calc(26px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; }
  .hud.texto { background:none; border:0; color:#fff; font:800 calc(26px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; text-shadow:0 2px 3px #000; }
  .hud.retrato { border-radius:50%; background:radial-gradient(circle at 50% 40%, #6b7ea8, #22304a); border:3px solid #b99a5b; }
  .hud.barra { border-radius:2px; background:linear-gradient(#2fcf5a 0 55%, #3aa0e8 55%); border:2px solid #b99a5b; padding:0; }
  .dica { position:absolute; left:600px; top:170px; flex-direction:column; gap:10px;
          color:rgba(255,255,255,.7); font:600 calc(28px * var(--s, 1)) 'Segoe UI', Arial, sans-serif; }
  .dica b { color:#ff9ccf; font:400 calc(42px * var(--s, 1)) 'Cherry Bomb One', 'Segoe UI', sans-serif; }
  .dica.fixa { position:fixed; left:16px; top:12px; gap:2px; font-size:15px; z-index:5; }
  .dica.fixa b { font-size:22px; }

  /* ---------- enfeites (SVG) ---------- */
  .pop, .placa, .balao, .circulo { transform-box:fill-box; transform-origin:50% 50%; }
  .balao { transform-origin:50% 100%; }
  .pisca   { transform-box:fill-box; transform-origin:50% 50%; opacity:0; animation:pisca var(--t) ease-in-out var(--d) infinite; }
  .cintila { transform-box:fill-box; transform-origin:50% 50%; animation:cintila var(--t) ease-in-out var(--d) infinite; }
  .brilho-borda { animation:corre var(--t) linear infinite; }
  .reflexo-v { transform-box:fill-box; transform-origin:50% 50%; animation:reflexo-v 6s ease-in-out 1s infinite; }

  /* Soul Gem e o círculo mágico */
  .gira { transform-box:fill-box; transform-origin:50% 50%; animation:gira 48s linear infinite; }
  .gira-contra { transform-box:fill-box; transform-origin:50% 50%; animation:gira 32s linear infinite reverse; }
  .aura { transform-box:fill-box; transform-origin:50% 50%; animation:aura 2.4s ease-in-out infinite alternate; }
  .evento .aura { animation-duration:.3s; }

  /* laço: as pontas balançam */
  .cauda-d { transform-box:fill-box; transform-origin:0% 50%; animation:balanca 3.2s ease-in-out infinite alternate; }
  .cauda-b { transform-box:fill-box; transform-origin:50% 0%; animation:balanca2 3.8s ease-in-out .7s infinite alternate; }

  /* Kyubey */
  .kb-olhos  { transform-box:fill-box; transform-origin:50% 50%; animation:olho 5.4s linear infinite; }
  .kb-fio-e  { transform-box:fill-box; transform-origin:30% 0%; animation:fio 3.4s ease-in-out infinite alternate; }
  .kb-fio-d  { transform-box:fill-box; transform-origin:70% 0%; animation:fio2 3.9s ease-in-out .6s infinite alternate; }
  .kb-rabo   { transform-box:fill-box; transform-origin:0% 100%; animation:rabo 2.6s ease-in-out infinite alternate; }
  .kb-cabeca { transform-box:fill-box; transform-origin:50% 90%; animation:inclina 8s ease-in-out infinite; }
  .fala .kb-cabeca { animation:fala .22s ease-out 4; }

  /* rosinhas */
  .balanco { transform-box:fill-box; transform-origin:50% 100%; animation:balanco var(--t) ease-in-out var(--d) infinite alternate; }

  @keyframes corre    { from { stroke-dashoffset:var(--de) } to { stroke-dashoffset:var(--ate) } }
  @keyframes reflexo-v { 0% { transform:translateY(0) skewY(-20deg) } 40%, 100% { transform:translateY(var(--dist)) skewY(-20deg) } }
  @keyframes pisca    { 0%, 100% { opacity:0; transform:scale(.2) rotate(0deg) } 50% { opacity:1; transform:scale(1) rotate(45deg) } }
  @keyframes cintila  { 0%, 100% { transform:scale(.86) rotate(0deg) } 50% { transform:scale(1.12) rotate(14deg) } }
  @keyframes gira     { to { transform:rotate(360deg) } }
  @keyframes aura     { from { opacity:.45; transform:scale(.88) } to { opacity:1; transform:scale(1.1) } }
  @keyframes balanca  { from { transform:rotate(-2.5deg) } to { transform:rotate(3deg) } }
  @keyframes balanca2 { from { transform:rotate(3deg) } to { transform:rotate(-2.5deg) } }
  @keyframes olho     { 0%, 93%, 100% { transform:scaleY(1) } 96% { transform:scaleY(.1) } }
  @keyframes fio      { from { transform:rotate(-5deg) } to { transform:rotate(6deg) } }
  @keyframes fio2     { from { transform:rotate(5deg) } to { transform:rotate(-6deg) } }
  @keyframes rabo     { from { transform:rotate(-7deg) } to { transform:rotate(9deg) } }
  @keyframes inclina  { 0%, 60%, 100% { transform:rotate(0) } 66%, 82% { transform:rotate(-9deg) } }
  @keyframes fala     { 0%, 100% { transform:rotate(0) translateY(0) } 45% { transform:rotate(-5deg) translateY(-1.5px) } }
  @keyframes balanco  { from { transform:rotate(calc(var(--a) * -1)) } to { transform:rotate(var(--a)) } }
</style>
</head>
<body>

<div class="palco">
  <div class="demo-only dica"></div>
  <div class="demo-only cam-box">câmera</div>
  <svg class="cena" xmlns="http://www.w3.org/2000/svg"></svg>
  <canvas></canvas>
  <svg class="topo" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
(function () {
  'use strict';
  const C = CONFIG, COR = C.cores, CONT = COR.contorno;
  const q = new URLSearchParams(location.search);
  const rnd = (a, b) => a + Math.random() * (b - a);
  const escolhe = arr => arr[Math.floor(Math.random() * arr.length)];
  const f = n => Math.round(n * 100) / 100;
  const num = (key, def, min, max) => {
    const v = parseFloat(q.get(key));
    return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
  };
  const NAO = /^(0|nao|não|false|off)$/i;
  const liga = (key, def) => q.has(key) ? !NAO.test(q.get(key)) : def;   // ?kyubey=0 desliga

  // ---------- modelo, tela e câmera (em pixels da tela do OBS) ----------
  // ?tela=lol: a fonte cobre a tela toda e a moldura cai no lugar da câmera
  // ?solta: só a câmera, com borda em volta toda; a fonte é a câmera + margem pros enfeites
  const SOLTA = q.has('solta') || q.get('tela') === 'solta';
  const TELA = C.telas[q.get('tela')] ? q.get('tela') : C.telaPadrao;
  let SW = C.tela.largura, SH = C.tela.altura, X, Y, W, H;
  if (SOLTA) {
    W = num('largura', C.solta.largura, 60, 3840); H = num('altura', C.solta.altura, 34, 2160);
  } else {
    const rq = (q.get('resolucao') || '').match(/^(\d{3,4})(?:\s*[x×*]\s*(\d{3,4}))?$/i);
    if (rq) { SW = +rq[1]; SH = rq[2] ? +rq[2] : Math.round(SW * 9 / 16); }
    const esc = SW / C.tela.largura, cam = C.telas[TELA].cam;   // ?resolucao=1280x720 sem x/y: as medidas encolhem junto
    X = num('x', cam.x * esc, 0, SW - 60); Y = num('y', cam.y * esc, 0, SH - 40);
    W = num('largura', cam.largura * esc, 60, SW - X); H = num('altura', cam.altura * esc, 34, SH - Y + 40);
  }
  const k = Math.min(2.4, Math.max(.4, Math.sqrt(W * H / 92000)));   // tamanho dos enfeites acompanha a área da câmera (a dela é quase quadrada)
  if (SOLTA) {                                          // margem em volta: 110 dos lados, 215 em cima (fita, Kyubey e flecha), 70 embaixo (numa câmera de 400)
    X = Math.round(110 * k); Y = Math.round(215 * k);
    SW = Math.round(X + W + 110 * k); SH = Math.round(Y + H + 70 * k);
  }
  const NOME = (q.has('nome') ? q.get('nome') : C.nome).trim().slice(0, 24);
  const NP = Math.round(num('penas', C.penas, 0, 300));
  const VEL = num('velocidade', C.velocidade, .1, 3);
  const FLECHA = num('flecha', C.flecha, 0, 3600);
  const MADOKA = liga('madoka', C.madoka), KYUBEY = liga('kyubey', C.kyubey), GEMA = liga('gema', C.gema);
  const LACO = liga('laco', C.laco), ROSAS = liga('rosas', C.rosas);
  let FALAS = C.falas.slice();
  if (q.has('falas')) {                                 // ?falas=0 desliga · ?falas=Oi,Tudo bem? troca a lista
    const g = q.get('falas').trim();
    if (NAO.test(g)) FALAS = [];
    else if (g && !/^(1|sim|true|on)$/i.test(g)) FALAS = g.split(',').map(s => s.trim().slice(0, 30)).filter(Boolean).slice(0, 40);
  }
  const B = C.borda * k, CW = 3.2 * k;                  // grossura da borda e do contorno
  const ins = B / 2 + CW / 2;                           // linha do meio da borda, por dentro da câmera
  const RAIO = Math.max(2, C.raio * k);                 // raio do canto, por fora
  // lados encostados na beirada da tela ficam sem borda (a moldura continua pra fora)
  const abre = SOLTA ? {} : { cima: Y <= 2, esq: X <= 2, dir: X + W >= SW - 2, baixo: Y + H >= SH - 2 };

  // área que o desenho ocupa (o resto da tela fica vazio): quanto passa da câmera pra cada lado
  let RX = 0, RY = 0, RR = SW, RB = SH;
  if (!SOLTA) {
    const m = [400, 280, 40, 30];                       // esquerda (fita, penas e a flecha), cima, direita, embaixo
    RX = Math.max(0, X - m[0] * k); RY = Math.max(0, Y - m[1] * k);
    RR = Math.min(SW, X + W + m[2] * k); RB = Math.min(SH, Y + H + m[3] * k);
  }
  const RW = RR - RX, RH = RB - RY;
  // na tela do LoL, em cima da câmera ficam os retratos dos aliados: dali pra direita nada sobe além da borda
  const LIM_DIR = SOLTA ? RR : X + 40 * k;

  const palco = document.querySelector('.palco');
  const cena = document.querySelector('.cena'), topo = document.querySelector('.topo');   // os balões ficam por cima das penas
  const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d');
  const medidor = document.createElement('canvas').getContext('2d');
  palco.style.width = SW + 'px'; palco.style.height = SH + 'px';
  palco.style.setProperty('--s', SOLTA ? 1 : SW / 1920);   // o HUD de mentirinha da prévia acompanha a tela
  for (const el of [cena, canvas, topo]) el.style.cssText = 'left:' + RX + 'px;top:' + RY + 'px;width:' + RW + 'px;height:' + RH + 'px';
  for (const el of [cena, topo]) el.setAttribute('viewBox', RX + ' ' + RY + ' ' + RW + ' ' + RH);

  // fundo de exemplo só fora do OBS (o OBS injeta window.obsstudio na página)
  let demo = C.fundoDemo === true || (C.fundoDemo === 'auto' && !window.obsstudio);
  if (q.has('preview')) demo = true;
  if (q.has('semfundo')) demo = false;
  if (demo) document.body.classList.add('demo');
  if (SOLTA) document.body.classList.add('solta');
  const zoom = demo && q.has('zoom') && !SOLTA;
  document.querySelector('.cam-box').style.cssText = 'left:' + X + 'px;top:' + Y + 'px;width:' + W + 'px;height:' + H + 'px';
  const dica = document.querySelector('.dica');
  dica.innerHTML = '<b>' + (SOLTA ? 'Só a câmera' : 'Tela do LoL') + ' · OBS · fonte Navegador · ' + SW + ' × ' + SH + '</b><span>clique em qualquer lugar pra soltar a flecha 🏹</span>';
  if (SOLTA) {                                          // a fonte é pequena: a dica fica fora dela
    dica.classList.add('fixa');
    dica.innerHTML += '<span>a câmera fica ' + X + ' px da esquerda e ' + Y + ' px do topo da fonte</span>';
    document.body.appendChild(dica);
  } else { dica.style.left = Math.round(SW * .3) + 'px'; dica.style.top = Math.round(SW * .09) + 'px'; }
  if (demo && !SOLTA) {                                 // o HUD do LoL e o overlay dela, de mentirinha (medido da live)
    const s = SW / 1920, hud = (cls, x, y, w, h, txt) => {
      const d = document.createElement('div');
      d.className = 'demo-only hud ' + cls;
      d.style.cssText = 'left:' + x * s + 'px;top:' + y * s + 'px;width:' + w * s + 'px;height:' + h * s + 'px';
      d.textContent = txt;
      palco.insertBefore(d, cena);
    };
    hud('', 0, 0, 270, 96, 'status');
    hud('texto', 900, 2, 360, 36, 'pixgg.com/lulululeta');
    hud('meta', 738, 44, 676, 52, 'live hiper mega alcoolica (R$ 49,49/R$ 100,00)');
    hud('texto', 930, 100, 300, 34, 'Termina em 1 semana');
    hud('', 1560, 0, 360, 32, '4 vs 7 · 0/1/7 · 02:24');
    hud('', 510, 965, 570, 115, 'habilidades');
    hud('', 1085, 975, 150, 105, 'itens');
    for (const x of [1683, 1750, 1818, 1886]) { hud('retrato', x - 28, 697, 56, 56, ''); hud('barra', x - 31, 757, 62, 18, ''); }
    hud('retrato', 1858, 630, 56, 56, '');
  }

  // ================================================================
  //  desenhos (strings SVG, coordenadas da tela)
  // ================================================================
  const anima = (t0, t1, a) => 'style="--t:' + f(rnd(t0, t1)) + 's;--d:-' + f(rnd(0, 6)) + 's;--a:' + a + 'deg"';

  // brilhinho de 4 pontas
  function dBrilho(cx, cy, r) {
    const a = r * .16, b = r * .3;
    return 'M' + f(cx) + ' ' + f(cy - r) +
      'C' + f(cx + a) + ' ' + f(cy - b) + ' ' + f(cx + b) + ' ' + f(cy - a) + ' ' + f(cx + r) + ' ' + f(cy) +
      'C' + f(cx + b) + ' ' + f(cy + a) + ' ' + f(cx + a) + ' ' + f(cy + b) + ' ' + f(cx) + ' ' + f(cy + r) +
      'C' + f(cx - a) + ' ' + f(cy + b) + ' ' + f(cx - b) + ' ' + f(cy + a) + ' ' + f(cx - r) + ' ' + f(cy) +
      'C' + f(cx - b) + ' ' + f(cy - a) + ' ' + f(cx - a) + ' ' + f(cy - b) + ' ' + f(cx) + ' ' + f(cy - r) + 'Z';
  }
  // estrela de 5 pontas
  function dEstrela(cx, cy, r) {
    let d = '';
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .47 : r;
      d += (i ? 'L' : 'M') + f(cx + Math.cos(a) * rr) + ' ' + f(cy + Math.sin(a) * rr);
    }
    return d + 'Z';
  }
  // coração centrado em (cx, cy), com uns 2r de largura
  function dCoracao(cx, cy, r) {

  // o contorno da borda: só nos lados que não encostam na beirada da tela
  function caminhoBorda(xl, yt, xr, yb, r, fora) {
    const tem = [!abre.cima, !abre.dir, !abre.baixo, !abre.esq];     // cima, direita, baixo, esquerda (sentido horário)
    const P = (i, fim, aberto) => {                                  // ponta do lado i: encurta pelo canto, ou estica pra fora da tela
      const e = aberto ? -fora : r;
      return i === 0 ? (fim ? [xr - e, yt] : [xl + e, yt]) : i === 1 ? (fim ? [xr, yb - e] : [xr, yt + e])
           : i === 2 ? (fim ? [xl + e, yb] : [xr - e, yb]) : (fim ? [xl, yt + e] : [xl, yb - e]);
    };
    const pt = p => f(p[0]) + ' ' + f(p[1]), arco = p => 'A' + f(r) + ' ' + f(r) + ' 0 0 1 ' + pt(p);
    if (tem.every(Boolean)) {
      let d = 'M' + pt(P(0, false, false));
      for (let i = 0; i < 4; i++) d += 'L' + pt(P(i, true, false)) + arco(P((i + 1) % 4, false, false));
      return d + 'Z';
    }
    let d = '';
    for (let s = 0; s < 4; s++) {
      if (!tem[s] || tem[(s + 3) % 4]) continue;                     // começa num lado cujo anterior está aberto
      let i = s;
      d += 'M' + pt(P(i, false, true));
      for (;;) {
        const prox = (i + 1) % 4, segue = tem[prox];
        d += 'L' + pt(P(i, true, !segue));
        if (!segue) break;
        d += arco(P(prox, false, false));
        i = prox;
      }
    }
    return d;
  }

    if (NOME) {
      const topo = gemaP ? gemaP.y + 19 * sG : Y + 14 * k, fim = Math.min(yb, SH) - (ROSAS ? 42 : 16) * k, pad = 9 * k;
      const letras = [...NOME.toUpperCase()], un = letras.reduce((a, c) => a + (c === ' ' ? .5 : 1), 0);
      let fs = 21 * k;
      if (topo + 2 * pad + fs * (un * .96 + .66) > fim) fs = Math.max(6 * k, (fim - topo - 2 * pad) / (un * .96 + .66));   // .66 fs = o corte em V
      if (fs >= 13 * k) {                               // letras empilhadas
        medidor.font = fs + 'px ' + FAMILIA;
        const larg = Math.max(...letras.map(c => medidor.measureText(c).width)), cap = medidor.measureText('L').actualBoundingBoxAscent || fs * .72;
        const TH = Math.max(fs * 1.5, larg + 12 * k, 26 * k), nV = TH * .42, adv = fs * .96;
        placa = { modo: 'letras', TH, nV, fs, adv, pad, cap, letras, y1: topo + 2 * pad + un * adv + nV };
      } else {                                          // nome comprido: deitado, lendo de baixo pra cima
        fs = 21 * k;
        medidor.font = fs + 'px ' + FAMILIA;
        let m = medidor.measureText(NOME), tw = m.width;
        const TH = Math.max(fs * 1.62, 28 * k), nV = TH * .42, maxL = fim - topo - 2 * pad - nV;
        if (tw > maxL) { fs *= maxL / tw; medidor.font = fs + 'px ' + FAMILIA; m = medidor.measureText(NOME); tw = m.width; }
        placa = { modo: 'deitado', TH, nV, fs, pad, asc: m.actualBoundingBoxAscent || fs * .7, desc: m.actualBoundingBoxDescent || 0, y1: topo + tw + 2 * pad + nV };
      }
      Object.assign(placa, { cx: xl, x0: xl - placa.TH / 2, x1: xl + placa.TH / 2, y0: topo });
      placa.cy = (placa.y0 + placa.y1 - placa.nV) / 2;
    }

    // ---- o Kyubey senta do lado de fora, lá embaixo, perto das rosinhas (no solto, em cima da borda de cima);
    //      a Madoka aparece em cima de um circulinho mágico, no ar, do lado do canto (no solto, em cima da borda) ----
    const kbP = !KYUBEY ? null : SOLTA ? { x: X + W * .3, y: Y + 1.4 * k } : { x: Math.max(RX + 30 * k, X - 44 * k), y: Math.min(SH, Y + H) - .5 * k, espelho: true };
    madP = SOLTA ? { x: X + W * .66, y: Y + 1.2 * k } : { x: Math.max(RX + 60 * k, X - 84 * k), y: Y - 2 * k, plat: true };

    const [gx, gy] = MADOKA ? [madP.x + G[0] * sMa, madP.y + G[1] * sMa] : gemaP ? [gemaP.x, gemaP.y] : [X + 10 * k, Y + 10 * k];
    const dist = Math.max(40 * k, Math.min((gx - RX - 75 * k) / -D[0], (gy - RY - 70 * k) / -D[1], 300 * k));
    alvo = { x: gx + D[0] * dist, y: gy + D[1] * dist, dx: gx, dy: gy };

    // ---- defs ----
    const hs = 14 * k;
    partes.push('<defs>' +
      '<linearGradient id="gOuro" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + COR.douradoClaro + '"/><stop offset=".45" stop-color="' + COR.dourado + '"/><stop offset="1" stop-color="' + COR.douradoEscuro + '"/></linearGradient>' +

      '<radialGradient id="gAura"><stop offset="0" stop-color="#ff8cc8" stop-opacity=".8"/><stop offset=".5" stop-color="#ff8cc8" stop-opacity=".3"/><stop offset="1" stop-color="#ff8cc8" stop-opacity="0"/></radialGradient>' +
      '<radialGradient id="gHalo"><stop offset="0" stop-color="#ff9ccf" stop-opacity=".3"/><stop offset=".72" stop-color="#ff9ccf" stop-opacity=".14"/><stop offset="1" stop-color="#ff9ccf" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="gLaco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a7e"/><stop offset=".5" stop-color="' + COR.vermelho + '"/><stop offset="1" stop-color="#a8142e"/></linearGradient>' +

        '<stop offset="0" stop-color="#ffb0d6"/><stop offset=".2" stop-color="' + COR.rosa + '"/><stop offset=".4" stop-color="#ffc4e0"/><stop offset=".6" stop-color="' + COR.rosa + '"/><stop offset=".8" stop-color="#ff9ccc"/><stop offset="1" stop-color="#e8559e"/></linearGradient>' +
      '<linearGradient id="gMiolo" gradientUnits="userSpaceOnUse" x1="0" y1="' + f(Y) + '" x2="0" y2="' + f(Y + H) + '"><stop offset="0" stop-color="#ffe6f2"/><stop offset="1" stop-color="#ffcce4"/></linearGradient>' +
      '<linearGradient id="gPlaca" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb3d6"/><stop offset=".5" stop-color="' + COR.rosa + '"/><stop offset="1" stop-color="#ec57a0"/></linearGradient>' +
      '<linearGradient id="gTexto" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#ffd6ea"/></linearGradient>' +

      '<pattern id="pCoracoes" patternUnits="userSpaceOnUse" width="' + f(hs) + '" height="' + f(hs) + '">' +

        '<path d="' + formaPlaca(0) + '" transform="translate(' + f(2.6 * k) + ' ' + f(2.6 * k) + ')" fill="rgba(0,0,0,.3)"/>' +

  }

  // ================================================================
  //  carimbos (desenhos prontos, pintados no canvas): penas e a Madoka
  // ================================================================
  const PENA_VB = [-10, -25, 20, 50], TAM_PENA = .78;   // tamanho da pena (vezes k)
  const CORES_PENA = [['#ffffff', '#ffe4f1', '#ffa6d2'], ['#fff4fa', '#ffc2df', '#ff7eb9'], ['#ffd0e6', '#ff8cc4', '#e2489a'], ['#ffffff', '#fff6fb', '#ffcfe5']];

  function svgPronto(vb, w, h, miolo) {

  function penaSVG(c) {                                 // pena de asa: haste curvinha, entalhes na beirada e penugem no pé
    const vane = 'M-1 -23C3 -20 6.5 -14 7.4 -9L4.6 -7.4L7.8 -5.4C8.2 -1 7 3.6 5.6 5.4L3.4 5.2L5.2 7.6C4 10.5 2.4 12.4 .6 13.4L.2 13.6' +

  function madokaSVG() {                                // a Madoka de garota mágica, de lado, com o arco de rosa (a corda, a flecha e o braço que puxa são pintados no canvas)

    return '<defs>' +

    // cabelo de trás e as marias-chiquinhas

    ctx.beginPath(); ctx.moveTo(OMBRO[0], OMBRO[1]); ctx.lineTo(mao[0], mao[1]); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4.2; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = CONT; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(mao[0], mao[1], 2.9, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff94c4';                          // a manga bufante por cima do ombro
    ctx.beginPath(); ctx.ellipse(10.6, -42.6, 4.6, 3.9, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(6.4, -40.4); ctx.quadraticCurveTo(10.6, -38, 14.8, -40.4); ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  function atualizaSeta(t) {
    const u = Math.min(1, (t - seta.t0) / seta.dur), px = seta.x, py = seta.y;
    seta.x = seta.x0 + (alvo.x - seta.x0) * u; seta.y = seta.y0 + (alvo.y - seta.y0) * u;
    for (let i = 0; i < 2; i++) {                       // rastro de brilho
      const v = Math.random();
      faisca(px + (seta.x - px) * v + rnd(-3, 3) * k, py + (seta.y - py) * v + rnd(-3, 3) * k, rnd(2.5, 5) * k, rnd(.3, .6), escolhe(['#fff', COR.rosaClaro, '#ff9ccc']));
    }
    if (u >= 1) { seta = null; estouro(alvo.x, alvo.y, t); }
  }
  function desenhaSeta() {
    if (!seta) return;
    const s = TAM_MA * k, L = L_FLECHA * s, x = seta.x, y = seta.y, bx = x - D[0] * L, by = y - D[1] * L;
    const rx = x - D[0] * L * 3.4, ry = y - D[1] * L * 3.4, g = ctx.createLinearGradient(rx, ry, x, y);
    g.addColorStop(0, 'rgba(255,140,200,0)'); g.addColorStop(1, 'rgba(255,180,220,.75)');
    ctx.lineCap = 'round';
    ctx.strokeStyle = g; ctx.lineWidth = 7 * k;
    ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(x, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(x, y);
    ctx.strokeStyle = '#ff8cc6'; ctx.lineWidth = 2.6 * s; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.1 * s; ctx.stroke();
    const r = 11 * k, gl = ctx.createRadialGradient(x, y, 0, x, y, r);
    gl.addColorStop(0, 'rgba(255,255,255,.95)'); gl.addColorStop(.4, 'rgba(255,160,210,.6)'); gl.addColorStop(1, 'rgba(255,120,190,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  function estouro(x, y, t) {
    parts.push({ tipo: 'estouro', x, y, tam: 1, rot: rnd(0, 1), idade: 0, vida: .75 });
    for (let i = 0; i < 16; i++) pluma(x, y);
    for (let i = 0; i < 18; i++) petala(x, y, 1);
    for (let i = 0; i < 10; i++) faisca(x + rnd(-30, 30) * k, y + rnd(-26, 26) * k, rnd(4, 8) * k, rnd(.5, 1), escolhe(['#fff', COR.rosaClaro, COR.douradoClaro]));
    for (let i = 0; i < 16; i++) chuvaFila.push({ t: t + .1 + rnd(0, .9), x: x + rnd(-70, 100) * k, y: y + rnd(-24, 20) * k });
    for (const p of penas) {                            // as penas que já estavam caindo levam um sopro
      const dx = p.x - x, dy = p.y - y, d = Math.hypot(dx, dy) || 1;
      if (d < 240 * k) { const fz = (1 - d / (240 * k)) * 170 * k; p.ix += dx / d * fz; p.iy += dy / d * fz - 30 * k; p.gira += rnd(-6, 6); }
    }
    brilhoPlaca();
    onda();
    if (kb) falar(C.falaFlecha, 2.4);
  }

  // ================================================================
  //  partículas (canvas): faíscas, pétalas, penas soltas, o estouro e a chuva de flechinhas
  // ================================================================
  const parts = [], MAXP = 420;
  function faisca(x, y, tam, vida, cor) { if (parts.length < MAXP) parts.push({ tipo: 'faisca', x, y, vx: rnd(-10, 10) * k, vy: rnd(-14, 6) * k, tam, vida, idade: 0, rot: rnd(0, 1.5), cor }); }
  function petala(x, y, forca) {
    if (parts.length >= MAXP) return;
    const a = rnd(0, Math.PI * 2), v = rnd(50, 170) * k * forca;
    parts.push({ tipo: 'petala', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * k * forca, w: rnd(2.6, 4) * k, h: rnd(1.6, 2.4) * k, rot: rnd(0, 6), vr: rnd(-7, 7),
                 fase: rnd(0, 7), vida: rnd(1.1, 1.8), idade: 0, cor: escolhe([COR.rosa, COR.rosaClaro, '#fff', '#ff9ccc', COR.rosaEscuro]) });
  }
  function pluma(x, y) {
    if (parts.length >= MAXP) return;
    const a = rnd(0, Math.PI * 2), v = rnd(70, 200) * k;
    parts.push({ tipo: 'pluma', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30 * k, rot: rnd(0, 6), vr: rnd(-8, 8), fase: rnd(0, 7),
                 tam: TAM_PENA * k * rnd(.7, 1.05), cor: Math.floor(rnd(0, CORES_PENA.length)), vida: rnd(2, 3), idade: 0 });
  }
  function chuva(x, y) { if (parts.length < MAXP) parts.push({ tipo: 'chuva', x, y, vx: -60 * k, vy: rnd(380, 470) * k, vida: rnd(.55, .8), idade: 0 }); }
  function puf(x, y, tam) {                             // brilho de chegada e de saída da Madoka
    parts.push({ tipo: 'estouro', x, y, tam, rot: rnd(0, 1), idade: 0, vida: .5 });
    for (let i = 0; i < 10; i++) petala(x + rnd(-8, 8) * k, y + rnd(-14, 14) * k, .6);
    for (let i = 0; i < 8; i++) faisca(x + rnd(-24, 24) * k, y + rnd(-30, 30) * k, rnd(3.5, 6) * k, rnd(.4, .8), escolhe(['#fff', COR.rosaClaro, COR.douradoClaro]));
  }
  function desenhaBrilho(x, y, s, rt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rt);
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.quadraticCurveTo(s * .18, -s * .18, s, 0); ctx.quadraticCurveTo(s * .18, s * .18, 0, s);
    ctx.quadraticCurveTo(-s * .18, s * .18, -s, 0); ctx.quadraticCurveTo(-s * .18, -s * .18, 0, -s);
    ctx.fill(); ctx.restore();
  }
  function desenhaParticulas(t, dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.idade += dt;
      if (p.idade >= p.vida) { parts.splice(i, 1); continue; }
      const u = p.idade / p.vida;
      if (p.tipo === 'estouro') {                       // clarão, anel e raios de luz
        const s = p.tam * k, e = 1 - u, R = (14 + 60 * u) * s, g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        g.addColorStop(0, 'rgba(255,255,255,' + f(.95 * e) + ')'); g.addColorStop(.35, 'rgba(255,160,210,' + f(.6 * e) + ')'); g.addColorStop(1, 'rgba(255,120,190,0)');
        ctx.globalAlpha = 1; ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.fill();
        ctx.globalAlpha = e; ctx.strokeStyle = '#ffd0e8'; ctx.lineWidth = 3 * s * e + .5;
        ctx.beginPath(); ctx.arc(p.x, p.y, (12 + 80 * u) * s, 0, 7); ctx.stroke();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * s * e + .3; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let j = 0; j < 12; j++) {
          const an = j * Math.PI / 6 + u * .5 + p.rot, r1 = (10 + 36 * u) * s, r2 = (22 + 84 * u) * s * (j % 2 ? .7 : 1);
          ctx.moveTo(p.x + Math.cos(an) * r1, p.y + Math.sin(an) * r1); ctx.lineTo(p.x + Math.cos(an) * r2, p.y + Math.sin(an) * r2);
        }
        ctx.stroke();
        continue;
      }
      let a = (u > .7 ? (1 - u) / .3 : 1) * naFonte(p.x, p.y);
      if (p.tipo === 'faisca') {
        p.x += p.vx * dt; p.y += p.vy * dt;
        if (a <= 0) continue;
        ctx.globalAlpha = a; ctx.fillStyle = p.cor;
        desenhaBrilho(p.x, p.y, p.tam * Math.sin(Math.min(1, u * 1.4) * Math.PI), p.rot + u * 1.4);
      } else if (p.tipo === 'petala') {
        p.vx *= 1 - Math.min(1, 1.8 * dt); p.vy = p.vy * (1 - Math.min(1, 1.8 * dt)) + 90 * k * dt;
        p.x += (p.vx + Math.sin(t * 4 + p.fase) * 18 * k) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        a *= pertoCam(p.x, p.y, 12 * k);
        if (a <= 0) continue;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.cos(t * 7 + p.fase));
        ctx.globalAlpha = a; ctx.fillStyle = p.cor;
        ctx.beginPath(); ctx.ellipse(0, 0, p.w, p.h, 0, 0, 7); ctx.fill();
        ctx.restore();
      } else if (p.tipo === 'pluma') {                  // pena solta do estouro: sai voando e cai balançando
        p.vx *= 1 - Math.min(1, 2.2 * dt); p.vy = p.vy * (1 - Math.min(1, 2.2 * dt)) + 60 * k * dt;
        p.x += (p.vx + Math.sin(t * 3 + p.fase) * 14 * k) * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.vr *= 1 - Math.min(1, dt * .8);
        a *= pertoCam(p.x, p.y, 16 * k);
        if (a <= 0 || !carimbosPena.length) continue;
        ctx.save(); ctx.globalAlpha = a; ctx.translate(p.x, p.y); ctx.rotate(p.rot + Math.sin(t * 4 + p.fase) * .4); ctx.scale(p.tam, p.tam);
        ctx.drawImage(carimbosPena[p.cor], PENA_VB[0], PENA_VB[1], PENA_VB[2], PENA_VB[3]);
        ctx.restore();
      } else if (p.tipo === 'chuva') {                  // flechinha de luz caindo
        p.x += p.vx * dt; p.y += p.vy * dt;
        a *= pertoCam(p.x, p.y, 30 * k) * Math.min(1, u * 6);
        if (a <= 0) continue;
        const L = 30 * k, n = Math.hypot(p.vx, p.vy), ux = p.vx / n, uy = p.vy / n, g = ctx.createLinearGradient(p.x - ux * L, p.y - uy * L, p.x, p.y);
        g.addColorStop(0, 'rgba(255,140,200,0)'); g.addColorStop(.7, 'rgba(255,150,205,.85)'); g.addColorStop(1, '#fff');
        ctx.globalAlpha = a; ctx.strokeStyle = g; ctx.lineWidth = 2.2 * k; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(p.x - ux * L, p.y - uy * L); ctx.lineTo(p.x, p.y); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(p.x + ux * 4.5 * k, p.y + uy * 4.5 * k); ctx.lineTo(p.x - uy * 2 * k, p.y + ux * 2 * k); ctx.lineTo(p.x + uy * 2 * k, p.y - ux * 2 * k); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ================================================================
  //  balõezinhos do Kyubey
  // ================================================================
  let balaoEl = null, tiraBalao = 0, tiraFala = 0, ultimaFala = '';
  function balao(texto, ax, ay, dur) {
    if (balaoEl) balaoEl.remove();
    clearTimeout(tiraBalao);
    const fs = 17 * k;
    medidor.font = fs + 'px ' + FAMILIA;
    const tw = medidor.measureText(texto).width, bw = tw + 24 * k, bh = fs * 1.4 + 8 * k;
    let cx = ax, cy = ay - bh / 2 - 16 * k;
    cx = Math.min(Math.min(RR, LIM_DIR) - bw / 2 - 4 * k, Math.max(RX + bw / 2 + 4 * k, cx));
    cy = Math.min(RB - bh / 2 - 4 * k, Math.max(RY + bh / 2 + 4 * k, cy));
    if (cx + bw / 2 > X && cx - bw / 2 < X + W && cy + bh / 2 > Y && cy - bh / 2 < Y + H) {   // nunca em cima da câmera: vai pro lado de fora, ou pra cima dela
      if (X - 6 * k - bw >= RX + 4 * k) cx = X - 6 * k - bw / 2;
      else cy = Math.max(RY + bh / 2 + 2 * k, Y - bh / 2 - 8 * k);
    }
    const x0 = cx - bw / 2, y0 = cy - bh / 2, y1 = cy + bh / 2;
    const bx = Math.min(x0 + bw - bh / 2 - 2 * k, Math.max(x0 + bh / 2 + 2 * k, ax)), ty = Math.max(ay, y1 + 6 * k);
    const cauda = 'M' + f(bx - 6 * k) + ' ' + f(y1 - 2.5 * k) + 'L' + f(ax + (ax - bx) * .2) + ' ' + f(ty) + 'L' + f(bx + 6 * k) + ' ' + f(y1 - 2.5 * k) + 'Z';
    const caixa = 'x="' + f(x0) + '" y="' + f(y0) + '" width="' + f(bw) + '" height="' + f(bh) + '" rx="' + f(bh / 2) + '"';
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'balao');
    g.innerHTML = '<rect ' + caixa + ' transform="translate(' + f(2 * k) + ' ' + f(3 * k) + ')" fill="rgba(0,0,0,.3)"/>' +
      '<path d="' + cauda + '" fill="#fff" stroke="' + CONT + '" stroke-width="' + f(2.4 * k) + '" stroke-linejoin="round"/>' +
      '<rect ' + caixa + ' fill="#fff" stroke="' + CONT + '" stroke-width="' + f(2.4 * k) + '"/>' +
      '<rect x="' + f(x0 + 2.6 * k) + '" y="' + f(y0 + 2.6 * k) + '" width="' + f(bw - 5.2 * k) + '" height="' + f(bh - 5.2 * k) + '" rx="' + f(bh / 2 - 2.6 * k) + '" fill="none" stroke="' + COR.rosaClaro + '" stroke-width="' + f(1.2 * k) + '"/>' +
      '<path d="' + cauda + '" fill="#fff"/>' +
      '<text x="' + f(cx + 1.2 * k) + '" y="' + f(cy + fs * .36 + 1.2 * k) + '" text-anchor="middle" font-family=\'' + FAMILIA.replace(/"/g, '') + '\' font-size="' + f(fs) + '" fill="' + COR.rosaClaro + '"></text>' +
      '<text x="' + f(cx) + '" y="' + f(cy + fs * .36) + '" text-anchor="middle" font-family=\'' + FAMILIA.replace(/"/g, '') + '\' font-size="' + f(fs) + '" fill="' + COR.magenta + '"></text>';
    for (const tx of g.querySelectorAll('text')) tx.textContent = texto;
    topo.appendChild(g);
    balaoEl = g;
    if (g.animate) g.animate([{ transform: 'scale(.2)', opacity: 0 }, { transform: 'scale(1.12)', opacity: 1, offset: .6 }, { transform: 'scale(1)', opacity: 1 }], { duration: 280, easing: 'ease-out' });
    tiraBalao = setTimeout(() => {
      const sai = () => { if (balaoEl === g) balaoEl = null; g.remove(); };
      if (g.animate) g.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.3)', opacity: 0 }], { duration: 220, easing: 'ease-in' }).onfinish = sai;
      else sai();
    }, (dur || 2.8) * 1000);
  }
  function falar(texto, dur) {                          // o Kyubey fala (sem Kyubey, o balão sai da fita)
    if (kb) {
      kbEl.classList.add('fala');
      clearTimeout(tiraFala);
      tiraFala = setTimeout(() => kbEl.classList.remove('fala'), 900);
      balao(texto, kb.x + (kb.espelho ? 3 : -3) * k, kb.topo + 4 * k, dur);
    } else if (placa) balao(texto, placa.x0, placa.y0 + 12 * k, dur);
  }
  function fala() {
    if (!FALAS.length || (!kb && !placa)) return;
    let txt = escolhe(FALAS);
    for (let i = 0; i < 5 && FALAS.length > 1 && txt === ultimaFala; i++) txt = escolhe(FALAS);
    ultimaFala = txt;
    falar(txt);
  }

  // ================================================================
  //  a fita pula e os enfeites pulam em onda
  // ================================================================
  function brilhoPlaca() {
    if (placaEl && placaEl.animate) {
      placaEl.animate([
        { transform: 'scale(1) rotate(0deg)' }, { transform: 'scale(1.18) rotate(-3deg)', offset: .25 },
        { transform: 'scale(.96) rotate(2deg)', offset: .5 }, { transform: 'scale(1.04) rotate(-1deg)', offset: .75 },
        { transform: 'scale(1) rotate(0deg)' },
      ], { duration: 850, easing: 'ease-out' });
    }
    if (!placa) return;
    for (let i = 0; i < 14; i++) petala(placa.cx + rnd(-.5, .5) * placa.TH, rnd(placa.y0, placa.y1), .8);
    for (let i = 0; i < 8; i++) faisca(placa.cx + rnd(-.8, .8) * placa.TH, rnd(placa.y0, placa.y1), rnd(4, 7.5) * k, rnd(.5, 1), escolhe([COR.douradoClaro, '#fff', COR.rosaClaro]));
  }
  function onda() {                                     // tudo pula, em onda a partir do nome
    const cx = placa ? placa.cx : X + W / 2;
    for (const el of cena.querySelectorAll('.pop')) {
      const d = Math.abs(el.dataset.x - cx) / Math.max(W, 200 * k);
      if (el.animate) el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: .35 }, { transform: 'scale(.96)', offset: .7 }, { transform: 'scale(1)' }],
        { duration: 560, delay: 60 + d * 600, easing: 'ease-out' });
    }
  }

  // ================================================================
  //  encaixe na janela / fonte do OBS
  // ================================================================
  let K = 1;
  function ajustar() {
    let s = Math.min(innerWidth / SW, innerHeight / SH);
    let ox = (innerWidth - SW * s) / 2, oy = (innerHeight - SH * s) / 2;
    if (zoom) {                                        // prévia: só a moldura, bem de perto
      s = Math.min(innerWidth / RW, innerHeight / RH);
      ox = (innerWidth - RW * s) / 2 - RX * s; oy = (innerHeight - RH * s) / 2 - RY * s;
    }
    palco.style.transform = 'translate(' + ox + 'px,' + oy + 'px) scale(' + s + ')';
    K = s * (window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(RW * K)); canvas.height = Math.max(1, Math.round(RH * K));
    prepararCarimbos();
  }

  // ================================================================
  //  loop
  // ================================================================
  let last = 0, proxFlecha = 0, proxFaisca = 0, proxFala = 0;
  function frame(ms) {
    const t = ms / 1000, dt = Math.min(.05, Math.max(0, t - last));
    last = t;
    if (FLECHA > 0 && t >= proxFlecha && !mad && !seta) { flecha(t); proxFlecha = t + FLECHA; }
    if (FALAS.length && t >= proxFala) {               // balãozinho do Kyubey (fora da flecha, que já tem a fala dela)
      const livre = t > evAte + .5;
      if (livre) fala();
      proxFala = t + (livre ? C.falasCada * rnd(.75, 1.25) : 2);
    }
    if (t >= proxFaisca && flores.length) {            // brilhinho de vez em quando na fita, na gema, no Kyubey ou nas rosas
      const fl = escolhe(flores);
      faisca(fl.x + rnd(-.8, .8) * fl.r, fl.y + rnd(-.8, .8) * fl.r, rnd(4, 6.5) * k, rnd(.5, .8), escolhe([COR.douradoClaro, '#fff', COR.rosaClaro]));
      proxFaisca = t + rnd(1, 2.4);
    }
    for (let i = chuvaFila.length - 1; i >= 0; i--) if (t >= chuvaFila[i].t) { chuva(chuvaFila[i].x, chuvaFila[i].y); chuvaFila.splice(i, 1); }
    tb += dt * VEL;
    for (const p of penas) moverPena(p, dt);
    if (mad) atualizaMadoka(t);
    if (seta) atualizaSeta(t);

    ctx.setTransform(K, 0, 0, K, -RX * K, -RY * K);
    ctx.clearRect(RX, RY, RW, RH);
    desenhaPenas();
    desenhaParticulas(t, dt);
    desenhaMadoka(t);
    desenhaSeta();
    requestAnimationFrame(frame);
  }

  function comecar() {
    if (comecou) return;
    comecou = true;
    montar();
    ajustar();
    addEventListener('resize', ajustar);
    const t = performance.now() / 1000;
    last = t; proxFlecha = t + (CONGELA ? .6 : 3); proxFaisca = t + 1; proxFala = t + 7;
    addEventListener('pointerdown', () => {            // clique (ou "Interagir" no OBS) = flecha agora
      const now = performance.now() / 1000;
      if (now - evT0 > 1.2 && !mad && !seta) { flecha(now); if (FLECHA > 0) proxFlecha = now + FLECHA; }
    });
    requestAnimationFrame(frame);
  }
  Promise.race([Promise.all([document.fonts.load('22px "' + C.fonte + '"', NOME || 'L'), document.fonts.load('17px "' + C.fonte + '"', FALAS.join('') + C.falaFlecha)]),
                new Promise(r => setTimeout(r, 3000))]).then(comecar, comecar);
})();
</script>
</body>
